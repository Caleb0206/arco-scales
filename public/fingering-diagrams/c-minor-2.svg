<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="title description">
  <title id="title">Two-octave C minor viola fingering diagram</title>
  <desc id="description">A two-octave natural C minor scale on viola. It starts on open C in first position and uses low first, second, and third fingers for the flat notes.</desc>

  <rect width="480" height="720" rx="24" fill="#fff8f5"/>
  <g transform="translate(0 -80) scale(1 1.1)">
    <g fill="#51443f" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <text x="110" y="116">C</text>
      <text x="190" y="116">G</text>
      <text x="270" y="116">D</text>
      <text x="350" y="116">A</text>
    </g>

    <path d="M48 138H432L470 654H10Z" fill="#3a2924"/>
    <path d="M48 138H432" stroke="#eee2dc" stroke-width="11" stroke-linecap="round"/>
    <g stroke="#d8cbc5" stroke-linecap="round">
      <path d="M110 142L80 654" stroke-width="6"/>
      <path d="M190 142L185 654" stroke-width="4.5"/>
      <path d="M270 142L295 654" stroke-width="3.4"/>
      <path d="M350 142L400 654" stroke-width="2.5"/>
    </g>

    <!-- C string: open C, D-1, E flat-low 2, F-3. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="109" cy="166" r="22" fill="#fff8f5" stroke="#765038" stroke-width="4"/>
      <text x="109" y="172" fill="#201c1b" font-size="17" font-weight="700">C</text>
      <text x="144" y="172" fill="#fff8f5" font-size="16" font-weight="700">0</text>
      <circle cx="104" cy="250" r="22" fill="#d4e5ff"/>
      <text x="104" y="256" fill="#15304a" font-size="17" font-weight="700">D</text>
      <text x="139" y="256" fill="#fff8f5" font-size="16" font-weight="700">1</text>
      <circle cx="99" cy="306" r="22" fill="#d4e5ff"/>
      <text x="99" y="312" fill="#15304a" font-size="16" font-weight="700">E♭</text>
      <text x="134" y="312" fill="#fff8f5" font-size="14" font-weight="700">2L</text>
      <circle cx="94" cy="408" r="22" fill="#d4e5ff"/>
      <text x="94" y="414" fill="#15304a" font-size="17" font-weight="700">F</text>
      <text x="129" y="414" fill="#fff8f5" font-size="16" font-weight="700">3</text>
    </g>

    <!-- G string: open G, A flat-low 1, B flat-low 2, C-low 3. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="190" cy="166" r="22" fill="#fff8f5" stroke="#765038" stroke-width="4"/>
      <text x="190" y="172" fill="#201c1b" font-size="17" font-weight="700">G</text>
      <text x="225" y="172" fill="#fff8f5" font-size="16" font-weight="700">0</text>
      <circle cx="189" cy="220" r="22" fill="#d4e5ff"/>
      <text x="189" y="226" fill="#15304a" font-size="16" font-weight="700">A♭</text>
      <text x="224" y="226" fill="#fff8f5" font-size="14" font-weight="700">1L</text>
      <circle cx="188" cy="306" r="22" fill="#d4e5ff"/>
      <text x="188" y="312" fill="#15304a" font-size="16" font-weight="700">B♭</text>
      <text x="223" y="312" fill="#fff8f5" font-size="14" font-weight="700">2L</text>
      <circle cx="187" cy="374" r="22" fill="#d4e5ff"/>
      <text x="187" y="380" fill="#15304a" font-size="17" font-weight="700">C</text>
      <text x="222" y="380" fill="#fff8f5" font-size="14" font-weight="700">3</text>
    </g>

    <!-- D string: open D, E flat-low 1, F-low 2, G-low 3. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="271" cy="166" r="22" fill="#fff8f5" stroke="#765038" stroke-width="4"/>
      <text x="271" y="172" fill="#201c1b" font-size="17" font-weight="700">D</text>
      <text x="306" y="172" fill="#fff8f5" font-size="16" font-weight="700">0</text>
      <circle cx="275" cy="220" r="22" fill="#d4e5ff"/>
      <text x="275" y="226" fill="#15304a" font-size="16" font-weight="700">E♭</text>
      <text x="310" y="226" fill="#fff8f5" font-size="14" font-weight="700">1L</text>
      <circle cx="278" cy="306" r="22" fill="#d4e5ff"/>
      <text x="278" y="312" fill="#15304a" font-size="17" font-weight="700">F</text>
      <text x="313" y="312" fill="#fff8f5" font-size="14" font-weight="700">2</text>
      <circle cx="281" cy="374" r="22" fill="#d4e5ff"/>
      <text x="281" y="380" fill="#15304a" font-size="17" font-weight="700">G</text>
      <text x="316" y="380" fill="#fff8f5" font-size="14" font-weight="700">3</text>
    </g>

    <!-- A string: open A, B flat-low 1, final C-low 2. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="352" cy="166" r="22" fill="#fff8f5" stroke="#765038" stroke-width="4"/>
      <text x="352" y="172" fill="#201c1b" font-size="17" font-weight="700">A</text>
      <text x="387" y="172" fill="#fff8f5" font-size="16" font-weight="700">0</text>
      <circle cx="360" cy="220" r="22" fill="#d4e5ff"/>
      <text x="360" y="226" fill="#15304a" font-size="16" font-weight="700">B♭</text>
      <text x="395" y="226" fill="#fff8f5" font-size="14" font-weight="700">1L</text>
      <circle cx="364" cy="306" r="22" fill="#d4e5ff"/>
      <text x="364" y="312" fill="#15304a" font-size="17" font-weight="700">C</text>
      <text x="399" y="312" fill="#fff8f5" font-size="14" font-weight="700">2</text>
    </g>

    <g transform="translate(28 680)" font-family="Arial, sans-serif" font-size="15" fill="#51443f">
      <circle cx="10" cy="-5" r="9" fill="#fff8f5" stroke="#765038" stroke-width="3"/>
      <text x="26" y="0">Open string</text>
      <circle cx="150" cy="-5" r="9" fill="#d4e5ff"/>
      <text x="166" y="0">Number = finger</text>
      <text x="288" y="0">L = low finger</text>
      <text x="286" y="25">Start: 1st position</text>
    </g>
  </g>
</svg>
