<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="title description">
  <title id="title">Two-octave C major viola fingering diagram</title>
  <desc id="description">A two-octave, first-position C major scale on viola. It begins on open C on the C string and ends on C with second finger on the A string.</desc>

  <rect width="480" height="720" rx="24" fill="#fff8f5"/>

  <!-- With the title removed, expand the actual diagram into that space. -->
  <g transform="translate(0 -90) scale(1 1.1)">
  <g fill="#51443f" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <text x="110" y="116">C</text>
    <text x="190" y="116">G</text>
    <text x="270" y="116">D</text>
    <text x="350" y="116">A</text>
  </g>

  <!-- Fingerboard and nut -->
  <path d="M48 138H432L470 654H10Z" fill="#3a2924"/>
  <path d="M48 138H432" stroke="#eee2dc" stroke-width="11" stroke-linecap="round"/>

  <!-- Strings: C is thickest; A is thinnest. -->
  <g stroke="#d8cbc5" stroke-linecap="round">
    <path d="M110 142L80 654" stroke-width="6"/>
    <path d="M190 142L185 654" stroke-width="4.5"/>
    <path d="M270 142L295 654" stroke-width="3.4"/>
    <path d="M350 142L400 654" stroke-width="2.5"/>
  </g>

  <!-- C string: open C, then D-1, E-2, F-3. -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="109" cy="166" r="22" fill="#fff8f5" stroke="#765038" stroke-width="4"/>
    <text x="109" y="172" fill="#201c1b" font-size="17" font-weight="700">C</text>
    <text x="144" y="172" fill="#fff8f5" font-size="16" font-weight="700">0</text>

    <circle cx="104" cy="262" r="22" fill="#d4e5ff"/>
    <text x="104" y="268" fill="#15304a" font-size="17" font-weight="700">D</text>
    <text x="139" y="268" fill="#fff8f5" font-size="16" font-weight="700">1</text>

    <circle cx="98" cy="366" r="22" fill="#d4e5ff"/>
    <text x="98" y="372" fill="#15304a" font-size="17" font-weight="700">E</text>
    <text x="133" y="372" fill="#fff8f5" font-size="16" font-weight="700">2</text>

    <circle cx="94" cy="426" r="22" fill="#d4e5ff"/>
    <text x="94" y="432" fill="#15304a" font-size="17" font-weight="700">F</text>
    <text x="129" y="432" fill="#fff8f5" font-size="16" font-weight="700">3</text>
  </g>

  <!-- G string: open G, then A-1, B-2, C-3. -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="190" cy="166" r="22" fill="#fff8f5" stroke="#765038" stroke-width="4"/>
    <text x="190" y="172" fill="#201c1b" font-size="17" font-weight="700">G</text>
    <text x="225" y="172" fill="#fff8f5" font-size="16" font-weight="700">0</text>

    <circle cx="189" cy="262" r="22" fill="#d4e5ff"/>
    <text x="189" y="268" fill="#15304a" font-size="17" font-weight="700">A</text>
    <text x="224" y="268" fill="#fff8f5" font-size="16" font-weight="700">1</text>

    <circle cx="188" cy="366" r="22" fill="#d4e5ff"/>
    <text x="188" y="372" fill="#15304a" font-size="17" font-weight="700">B</text>
    <text x="223" y="372" fill="#fff8f5" font-size="16" font-weight="700">2</text>

    <circle cx="187" cy="426" r="22" fill="#d4e5ff"/>
    <text x="187" y="432" fill="#15304a" font-size="17" font-weight="700">C</text>
    <text x="222" y="432" fill="#fff8f5" font-size="16" font-weight="700">3</text>
  </g>

  <!-- D string: open D, then E-1, F-low-2, G-3. -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="271" cy="166" r="22" fill="#fff8f5" stroke="#765038" stroke-width="4"/>
    <text x="271" y="172" fill="#201c1b" font-size="17" font-weight="700">D</text>
    <text x="306" y="172" fill="#fff8f5" font-size="16" font-weight="700">0</text>

    <circle cx="276" cy="262" r="22" fill="#d4e5ff"/>
    <text x="276" y="268" fill="#15304a" font-size="17" font-weight="700">E</text>
    <text x="311" y="268" fill="#fff8f5" font-size="16" font-weight="700">1</text>

    <circle cx="279" cy="322" r="22" fill="#d4e5ff"/>
    <text x="279" y="328" fill="#15304a" font-size="17" font-weight="700">F</text>
    <text x="314" y="328" fill="#fff8f5" font-size="16" font-weight="700">2</text>

    <circle cx="284" cy="426" r="22" fill="#d4e5ff"/>
    <text x="284" y="432" fill="#15304a" font-size="17" font-weight="700">G</text>
    <text x="319" y="432" fill="#fff8f5" font-size="16" font-weight="700">3</text>
  </g>

  <!-- A string: open A, then B-1 and the final C-low-2. -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="352" cy="166" r="22" fill="#fff8f5" stroke="#765038" stroke-width="4"/>
    <text x="352" y="172" fill="#201c1b" font-size="17" font-weight="700">A</text>
    <text x="387" y="172" fill="#fff8f5" font-size="16" font-weight="700">0</text>

    <circle cx="361" cy="262" r="22" fill="#d4e5ff"/>
    <text x="361" y="268" fill="#15304a" font-size="17" font-weight="700">B</text>
    <text x="396" y="268" fill="#fff8f5" font-size="16" font-weight="700">1</text>

    <circle cx="367" cy="322" r="22" fill="#d4e5ff"/>
    <text x="367" y="328" fill="#15304a" font-size="17" font-weight="700">C</text>
    <text x="402" y="328" fill="#fff8f5" font-size="16" font-weight="700">2</text>
  </g>

  <g transform="translate(28 680)" font-family="Arial, sans-serif" font-size="15" fill="#51443f">
    <circle cx="10" cy="-5" r="9" fill="#fff8f5" stroke="#765038" stroke-width="3"/>
    <text x="26" y="0">Open string</text>
    <circle cx="166" cy="-5" r="9" fill="#d4e5ff"/>
    <text x="182" y="0">Number = finger</text>
  </g>
  </g>
</svg>
