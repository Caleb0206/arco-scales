<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="title description">
  <title id="title">Two-octave D major viola fingering diagram</title>
  <desc id="description">A two-octave, first-position D major scale on viola. It starts with D on first finger of the C string and ends with D on third finger of the A string. F sharp and C sharp are used.</desc>

  <rect width="480" height="720" rx="24" fill="#fff8f5"/>

  <g transform="translate(0 -90) scale(1 1.1)">
    <g fill="#51443f" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <text x="110" y="116">C</text>
      <text x="190" y="116">G</text>
      <text x="270" y="116">D</text>
      <text x="350" y="116">A</text>
    </g>

    <path d="M48 138H432L470 654H10Z" fill="#3a2924"/>
    <path d="M48 138H432" stroke="#eee2dc" stroke-width="11" stroke-linecap="round"/>

    <g stroke="#d8cbc5" stroke-linecap="round">
      <path d="M110 142L80 654" stroke-width="6"/>
      <path d="M190 142L185 654" stroke-width="4.5"/>
      <path d="M270 142L295 654" stroke-width="3.4"/>
      <path d="M350 142L400 654" stroke-width="2.5"/>
    </g>

    <!-- C string: D-1, E-2, F sharp-3, G-4. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="106" cy="220" r="22" fill="#d4e5ff"/><text x="106" y="226" fill="#15304a" font-size="17" font-weight="700">D</text><text x="141" y="226" fill="#fff8f5" font-size="16" font-weight="700">1</text>
      <circle cx="101" cy="320" r="22" fill="#d4e5ff"/><text x="101" y="326" fill="#15304a" font-size="17" font-weight="700">E</text><text x="136" y="326" fill="#fff8f5" font-size="16" font-weight="700">2</text>
      <circle cx="96" cy="410" r="22" fill="#d4e5ff"/><text x="96" y="416" fill="#15304a" font-size="16" font-weight="700">F♯</text><text x="131" y="416" fill="#fff8f5" font-size="16" font-weight="700">3</text>
      <circle cx="92" cy="465" r="22" fill="#d4e5ff"/><text x="92" y="471" fill="#15304a" font-size="17" font-weight="700">G</text><text x="127" y="471" fill="#fff8f5" font-size="16" font-weight="700">4</text>
    </g>

    <!-- G string: A-1, B-2, C sharp-3, D-4. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="189" cy="220" r="22" fill="#d4e5ff"/><text x="189" y="226" fill="#15304a" font-size="17" font-weight="700">A</text><text x="224" y="226" fill="#fff8f5" font-size="16" font-weight="700">1</text>
      <circle cx="188" cy="320" r="22" fill="#d4e5ff"/><text x="188" y="326" fill="#15304a" font-size="17" font-weight="700">B</text><text x="223" y="326" fill="#fff8f5" font-size="16" font-weight="700">2</text>
      <circle cx="187" cy="410" r="22" fill="#d4e5ff"/><text x="187" y="416" fill="#15304a" font-size="16" font-weight="700">C♯</text><text x="222" y="416" fill="#fff8f5" font-size="16" font-weight="700">3</text>
      <circle cx="186" cy="465" r="22" fill="#d4e5ff"/><text x="186" y="471" fill="#15304a" font-size="17" font-weight="700">D</text><text x="221" y="471" fill="#fff8f5" font-size="16" font-weight="700">4</text>
    </g>

    <!-- D string: E-1, F sharp-2, G-3, A-4. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="274" cy="220" r="22" fill="#d4e5ff"/><text x="274" y="226" fill="#15304a" font-size="17" font-weight="700">E</text><text x="309" y="226" fill="#fff8f5" font-size="16" font-weight="700">1</text>
      <circle cx="279" cy="320" r="22" fill="#d4e5ff"/><text x="279" y="326" fill="#15304a" font-size="16" font-weight="700">F♯</text><text x="314" y="326" fill="#fff8f5" font-size="16" font-weight="700">2</text>
      <circle cx="282" cy="375" r="22" fill="#d4e5ff"/><text x="282" y="381" fill="#15304a" font-size="17" font-weight="700">G</text><text x="317" y="381" fill="#fff8f5" font-size="16" font-weight="700">3</text>
      <circle cx="286" cy="465" r="22" fill="#d4e5ff"/><text x="286" y="471" fill="#15304a" font-size="17" font-weight="700">A</text><text x="321" y="471" fill="#fff8f5" font-size="16" font-weight="700">4</text>
    </g>

    <!-- A string: B-1, C sharp-2, D-3. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="358" cy="220" r="22" fill="#d4e5ff"/><text x="358" y="226" fill="#15304a" font-size="17" font-weight="700">B</text><text x="393" y="226" fill="#fff8f5" font-size="16" font-weight="700">1</text>
      <circle cx="368" cy="320" r="22" fill="#d4e5ff"/><text x="368" y="326" fill="#15304a" font-size="16" font-weight="700">C♯</text><text x="403" y="326" fill="#fff8f5" font-size="16" font-weight="700">2</text>
      <circle cx="373" cy="375" r="22" fill="#d4e5ff"/><text x="373" y="381" fill="#15304a" font-size="17" font-weight="700">D</text><text x="408" y="381" fill="#fff8f5" font-size="16" font-weight="700">3</text>
    </g>

    <g transform="translate(28 680)" font-family="Arial, sans-serif" font-size="15" fill="#51443f">
      <circle cx="10" cy="-5" r="9" fill="#d4e5ff"/>
      <text x="26" y="0">Number = finger</text>
      <text x="190" y="0">D major: F♯ · C♯</text>
    </g>
  </g>
</svg>
