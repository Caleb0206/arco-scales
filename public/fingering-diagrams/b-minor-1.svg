<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" role="img" aria-labelledby="title description">
  <title id="title">Two-octave B minor viola fingering diagram</title>
  <desc id="description">A two-octave natural B minor scale on viola. Start in first position with second finger B on the G string, then shift on the A string for the upper F sharp, G, A, and B.</desc>

  <rect width="480" height="720" rx="24" fill="#fff8f5"/>
  <g transform="translate(0 -80) scale(1 1.1)">
    <g fill="#51443f" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
      <text x="110" y="116">C</text>
      <text x="190" y="116">G</text>
      <text x="270" y="116">D</text>
      <text x="350" y="116">A</text>
    </g>

    <path d="M48 138H432L470 654H10Z" fill="#3a2924"/>
    <path d="M48 138H432" stroke="#eee2dc" stroke-width="11" stroke-linecap="round"/>
    <g stroke="#d8cbc5" stroke-linecap="round">
      <path d="M110 142L80 654" stroke-width="6"/>
      <path d="M190 142L185 654" stroke-width="4.5"/>
      <path d="M270 142L295 654" stroke-width="3.4"/>
      <path d="M350 142L400 654" stroke-width="2.5"/>
    </g>

    <!-- G string: B-2, C sharp-3, D-4. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="188" cy="318" r="22" fill="#d4e5ff"/>
      <text x="188" y="324" fill="#15304a" font-size="17" font-weight="700">B</text>
      <text x="223" y="324" fill="#fff8f5" font-size="16" font-weight="700">2</text>
      <circle cx="187" cy="392" r="22" fill="#d4e5ff"/>
      <text x="187" y="398" fill="#15304a" font-size="16" font-weight="700">C♯</text>
      <text x="222" y="398" fill="#fff8f5" font-size="16" font-weight="700">3</text>
      <circle cx="186" cy="482" r="22" fill="#d4e5ff"/>
      <text x="186" y="488" fill="#15304a" font-size="17" font-weight="700">D</text>
      <text x="221" y="488" fill="#fff8f5" font-size="16" font-weight="700">4</text>
    </g>

    <!-- D string: E-1, F sharp-2, G-3, A-4. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="275" cy="250" r="22" fill="#d4e5ff"/>
      <text x="275" y="256" fill="#15304a" font-size="17" font-weight="700">E</text>
      <text x="310" y="256" fill="#fff8f5" font-size="16" font-weight="700">1</text>
      <circle cx="278" cy="330" r="22" fill="#d4e5ff"/>
      <text x="278" y="336" fill="#15304a" font-size="16" font-weight="700">F♯</text>
      <text x="313" y="336" fill="#fff8f5" font-size="16" font-weight="700">2</text>
      <circle cx="281" cy="408" r="22" fill="#d4e5ff"/>
      <text x="281" y="414" fill="#15304a" font-size="17" font-weight="700">G</text>
      <text x="316" y="414" fill="#fff8f5" font-size="16" font-weight="700">3</text>
      <circle cx="285" cy="486" r="22" fill="#d4e5ff"/>
      <text x="285" y="492" fill="#15304a" font-size="17" font-weight="700">A</text>
      <text x="320" y="492" fill="#fff8f5" font-size="16" font-weight="700">4</text>
    </g>

    <!-- A string: B-1, C sharp-2, D-3, E-4; shift to F sharp-1, G-2, A-3, B-4. -->
    <g font-family="Arial, sans-serif" text-anchor="middle">
      <circle cx="360" cy="250" r="22" fill="#d4e5ff"/>
      <text x="360" y="256" fill="#15304a" font-size="17" font-weight="700">B</text>
      <text x="395" y="256" fill="#fff8f5" font-size="16" font-weight="700">1</text>
      
    </g>

    <g transform="translate(28 680)" font-family="Arial, sans-serif" font-size="15" fill="#51443f">
      <circle cx="10" cy="-5" r="9" fill="#d4e5ff"/>
      <text x="26" y="0">Number = finger</text>

    </g>
  </g>
</svg>
